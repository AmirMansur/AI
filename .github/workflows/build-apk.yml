name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate the Android project
        run: |
          mkdir -p app/src/main/java/com/aiassistant app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'AIAssistant'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2g' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.aiassistant'
            compileSdk 34
            defaultConfig { applicationId 'com.aiassistant'; minSdk 26; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="AI Assistant" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.DarkActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/assets/hub-agent.yml <<'EOF'
          name: Agent
          on:
            workflow_dispatch:
              inputs:
                repo:
                  description: owner/repo to build
                  required: true
                task:
                  description: optional single task
                  required: false
                  default: ''
                step:
                  description: step counter
                  required: false
                  default: '1'
          permissions:
            contents: read
            actions: write
          concurrency:
            group: agent-@{{ inputs.repo }}
            cancel-in-progress: false
          jobs:
            run:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                - run: node agent.mjs
                  env:
                    ANTHROPIC_API_KEY: @{{ secrets.ANTHROPIC_API_KEY }}
                    GH_PAT: @{{ secrets.GH_PAT }}
                    GITHUB_TOKEN: @{{ github.token }}
                    HUB: @{{ github.repository }}
                    HUB_REF: @{{ github.ref_name }}
                    TARGET: @{{ inputs.repo }}
                    TASK: @{{ inputs.task }}
                    STEP: @{{ inputs.step }}
                    AI_MODEL: @{{ vars.AI_MODEL }}
                    MAX_STEPS: @{{ vars.MAX_STEPS }}
          EOF
          sed -i 's/@{{/\x24{{/g' app/src/main/assets/hub-agent.yml
                    cat > app/src/main/assets/hub-agent.mjs <<'EOF'
          import fs from 'fs';
          import {execSync} from 'child_process';
          const E=process.env,TARGET=E.TARGET||'',HUB=E.HUB||'',PAT=E.GH_PAT||'',STEP=parseInt(E.STEP||'1'),MAXS=parseInt(E.MAX_STEPS||'8'),
            MODEL=E.AI_MODEL||'claude-sonnet-5-5',BR='agent/build';
          const SEC=/(AIza[\w-]{35}|ghp_\w{20,}|github_pat_\w{20,}|sk-[\w-]{20,}|BEGIN [A-Z ]*PRIVATE KEY)/;
          const clean=s=>String(s).split(PAT||'\u0000').join('***').split(E.ANTHROPIC_API_KEY||'\u0000').join('***');
          const sh=c=>execSync(c,{stdio:'pipe',maxBuffer:1<<26}).toString();
          const rd=f=>fs.existsSync(f)?fs.readFileSync(f,'utf8'):'';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pj=t=>JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
          async function gh(m,p,b,tok){
            const r=await fetch('https://api.github.com'+p,{method:m,headers:{Authorization:'Bearer '+(tok||PAT),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
            const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
            return {ok:r.ok,status:r.status,json:j};
          }
          let issue=0;
          async function say(t){t=clean(t);console.log(t);if(issue)await gh('POST','/repos/'+TARGET+'/issues/'+issue+'/comments',{body:t});}
          async function claude(prompt){
            for(let a=0;a<3;a++){
              const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
                headers:{'content-type':'application/json','x-api-key':E.ANTHROPIC_API_KEY||'','anthropic-version':'2023-06-01'},
                body:JSON.stringify({model:MODEL,max_tokens:16000,messages:[{role:'user',content:prompt}]})});
              if(r.ok){const j=await r.json();return j.content.map(c=>c.text||'').join('');}
              const t=await r.text();
              if(r.status>=500&&a<2){await sleep(5000*(a+1));continue;}
              const e=new Error('Claude API '+r.status+': '+t.slice(0,200));
              e.paused=r.status===429||/credit|billing|quota|limit/i.test(t);throw e;
            }
          }
          async function main(){
            if(!/^[\w.-]+\/[\w.-]+$/.test(TARGET)||TARGET.split('/')[0]!==HUB.split('/')[0])throw new Error('Bad target repo');
            const l=await gh('GET','/repos/'+TARGET+'/issues?labels=agent-log&state=open&per_page=1');
            if(l.ok&&l.json&&l.json.length)issue=l.json[0].number;
            else{const c=await gh('POST','/repos/'+TARGET+'/issues',{title:'Build log',body:'Live progress from the AI agent.',labels:['agent-log']});if(c.ok)issue=c.json.number;}
            await say('Step '+STEP+' started (model '+MODEL+').');
            sh('git clone https://x-access-token:'+PAT+'@github.com/'+TARGET+'.git work');
            process.chdir('work');
            sh('git config user.name ai-agent && git config user.email ai-agent@users.noreply.github.com');
            sh(sh('git ls-remote --heads origin '+BR).trim()?'git checkout -B '+BR+' origin/'+BR:'git checkout -b '+BR);
            fs.mkdirSync('.ai',{recursive:true});
            let tasks=rd('.ai/TASKS.md');
            if(!E.TASK&&!/^- \[[ x]\]/m.test(tasks)){
              await say('Planning: turning your prompt into a task list.');
              const p=pj(await claude('Read the PROJECT below and write a build plan of 4 to 10 small, ordered tasks, each doable in one coding session. JSON only: {"tasks":["..."]}\n\nPROJECT:\n'+rd('.ai/PROJECT.md')));
              tasks='# Tasks\n'+p.tasks.map(t=>'- [ ] '+t).join('\n')+'\n';
              fs.writeFileSync('.ai/TASKS.md',tasks);
              await say('Plan:\n'+p.tasks.map((t,i)=>(i+1)+'. '+t).join('\n'));
            }
            const m=tasks.match(/^- \[ \] (.+)$/m),task=E.TASK||(m&&m[1]);
            if(!task){await say('All tasks are done. Review the pull request and merge it when you are happy.');return;}
            await say('Working on: '+task);
            const files=sh('git ls-files').split('\n').filter(f=>f&&!f.startsWith('.ai/')&&!/(^|\/)node_modules\//.test(f)&&!/\.(png|jpe?g|gif|webp|ico|zip|jar|apk|lock|keystore|ttf|woff2?|mp4|pdf)$/i.test(f));
            let budget=60000,code='';
            for(const f of files){const t=rd(f);if(t.length>12000||t.length>budget)continue;budget-=t.length;code+='\n### '+f+'\n'+t;}
            const out=pj(await claude(['You are a careful senior engineer building a project step by step. Do ONLY the task below and follow AGENTS.',
              'Reply with JSON only: {"summary":string,"files":[{"path":string,"content":string}],"memory_notes":string,"task_done":boolean}. Each file is written in full. Never include secrets. If the project is an Android app, also keep a GitHub Actions workflow at .github/workflows/build-apk.yml (workflow file names must start with build).',
              'PROJECT:',rd('.ai/PROJECT.md'),'DECISIONS:',rd('.ai/DECISIONS.md'),'AGENTS:',rd('.ai/AGENTS.md'),'PROGRESS (latest):',rd('.ai/PROGRESS.md').slice(-3000),'CODE:',code,'TASK:',task].join('\n')));
            const written=[],blocked=[];
            for(const f of out.files||[]){
              const p=String(f.path||''),c=String(f.content||'');
              if(!p||p.startsWith('/')||p.includes('..')||p.startsWith('.git/')||p.startsWith('.ai/')||/(^|\/)\.env/.test(p)||(p.startsWith('.github')&&!/^\.github\/workflows\/build[\w.-]*\.ya?ml$/.test(p))||SEC.test(c)){blocked.push(p);continue;}
              fs.mkdirSync(p.includes('/')?p.slice(0,p.lastIndexOf('/')):'.',{recursive:true});
              fs.writeFileSync(p,c);written.push(p);
            }
            let res='no tests configured';
            if(/"test"\s*:/.test(rd('package.json'))){
              try{sh('npm install --no-audit --no-fund');sh('npm test');res='PASSED';}
              catch(e){res='FAILED';}
            }
            const failed=res==='FAILED',done=out.task_done===true&&!failed;
            if(done&&!E.TASK)fs.writeFileSync('.ai/TASKS.md',rd('.ai/TASKS.md').replace('- [ ] '+task,'- [x] '+task));
            const notes=out.memory_notes&&!SEC.test(out.memory_notes)?out.memory_notes:'';
            fs.appendFileSync('.ai/PROGRESS.md','\n## '+new Date().toISOString()+' - '+task+'\n- Files: '+(written.join(', ')||'none')+'\n- Blocked: '+(blocked.join(', ')||'none')+'\n- Tests: '+res+'\n- Task done: '+done+'\n- Notes: '+notes+'\n');
            sh('git add -A');
            sh('git commit -m "AI agent step '+STEP+'" --allow-empty');
            sh('git push -u origin '+BR);
            const info=(await gh('GET','/repos/'+TARGET)).json,owner=TARGET.split('/')[0];
            const pr=await gh('GET','/repos/'+TARGET+'/pulls?state=open&head='+owner+':'+BR);
            if(pr.ok&&pr.json&&!pr.json.length)await gh('POST','/repos/'+TARGET+'/pulls',{title:'AI build',head:BR,base:info.default_branch,body:'Work by the AI agent. Review, then merge.'});
            await say('Finished: '+task+'\n'+(out.summary||'')+'\nFiles: '+(written.join(', ')||'none')+'\nBlocked (needs your approval): '+(blocked.join(', ')||'none')+'\nTests: '+res+'\nTask marked done: '+done);
            const more=!E.TASK&&/^- \[ \]/m.test(rd('.ai/TASKS.md'));
            if(failed||!done&&!E.TASK){await say('Stopped: this task is not finished or tests failed. Check the pull request, then tap Continue.');return;}
            if(more&&STEP<MAXS){
              const d=await gh('POST','/repos/'+HUB+'/actions/workflows/agent.yml/dispatches',{ref:E.HUB_REF||'main',inputs:{repo:TARGET,task:'',step:String(STEP+1)}},E.GITHUB_TOKEN);
              if(!d.ok)await say('Could not start the next step ('+d.status+'). Tap Continue in the app.');
            }else if(more)await say('Reached the safety limit of '+MAXS+' steps. Tap Continue in the app to run more.');
            else await say('All tasks are done. Review the pull request and merge it when you are happy.');
          }
          main().catch(async e=>{
            const m=clean(e.message||e);
            try{await say(e.paused?'PAUSED: Claude refused the request ('+m+'). Add API credit or wait for the limit to reset, then tap Continue in the app. Your progress is saved.':'FAILED: '+m);}catch(x){console.log(m);}
            process.exit(1);
          });
          EOF
                    cat > app/src/main/java/com/aiassistant/MainActivity.java <<'EOF'
          package com.aiassistant;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.util.Base64;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
            static final Pattern SEC = Pattern.compile("(ghp_\\w{20,}|github_pat_\\w{20,}|AIza[\\w-]{35}|sk-[\\w-]{20,}|BEGIN [A-Z ]*PRIVATE KEY)");
            static final String SUM = "Summarise this chat for project memory: goal, requirements, decisions with reasons, constraints, finished work, unfinished work, next steps. Short bullets. Leave out passwords, keys and tokens.";
            static final String[][] MEM = {
              {"PROJECT", ""},
              {"DECISIONS", "# Decisions\n(decision - reason)\n"},
              {"TASKS", "# Tasks\n"},
              {"AGENTS", "# Agent rules\n- Small, reversible changes only\n- Never touch secrets\n- Never claim success without passing tests\n"},
              {"PROGRESS", "# Progress\n(checkpoints are added automatically)\n"}};
            static class R { int code; String body = ""; }

            SharedPreferences sp;
            ExecutorService ex = Executors.newSingleThreadExecutor();
            Handler h = new Handler(Looper.getMainLooper());
            LinearLayout box;
            EditText tok, hubBox, nameBox, promptBox, tt, tb, impBox;
            Spinner repos, projs;
            TextView logv, feedv;
            Button autoB;
            boolean auto = false;
            Runnable tick = new Runnable() { public void run() { if (!auto) return; progress(); h.postDelayed(this, 10000); } };

            @Override protected void onCreate(Bundle s) {
              super.onCreate(s);
              sp = getSharedPreferences("a", 0);
              ScrollView sv = new ScrollView(this);
              box = new LinearLayout(this);
              box.setOrientation(LinearLayout.VERTICAL);
              box.setPadding(24, 24, 24, 24);
              sv.addView(box);
              setContentView(sv);
              head("1. GitHub access", "Paste your GitHub token, then load your repositories.");
              tok = edit("GitHub token", false);
              tok.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
              tok.setText(sp.getString("t", ""));
              btn("Save token and load repositories", v -> loadRepos());
              head("2. The hub (one time)", "The hub is a private repo that runs the AI for all your projects. Create it once, then add two secrets in it on GitHub.");
              hubBox = edit("Hub repo (owner/name)", false);
              hubBox.setText(sp.getString("hub", ""));
              btn("Create the hub", v -> mkHub());
              head("3. New project from a prompt", "Describe what to build. The app creates the repo and the AI starts building.");
              nameBox = edit("Project name, for example notes-app", false);
              promptBox = edit("What should be built?", true);
              btn("Create and build", v -> create());
              head("4. Watch progress", "Choose a project to see what the AI is doing.");
              repos = new Spinner(this); box.addView(repos);
              btn("Add this repo as a project", v -> addP());
              projs = new Spinner(this); box.addView(projs);
              refreshP();
              btn("Refresh progress", v -> progress());
              autoB = btn("Auto-refresh: off", v -> { auto = !auto; autoB.setText("Auto-refresh: " + (auto ? "on" : "off")); if (auto) h.post(tick); });
              feedv = new TextView(this); box.addView(feedv);
              btn("Continue building / resume", v -> go(""));
              btn("Stop the running agent", v -> cancel());
              head("5. Give one task", "Ask the AI to do one specific thing in the chosen project.");
              tt = edit("Task title", false);
              tb = edit("Task details", true);
              btn("Submit this task", v -> go(tt.getText().toString().trim() + "\n" + tb.getText().toString()));
              head("6. Switching Claude accounts", "Save a summary of an old chat, then copy everything for the new chat.");
              impBox = edit("Paste a summary of an old chat", true);
              btn("Save summary to memory", v -> save());
              btn("Copy full context for a new chat", v -> ctx());
              btn("Copy summarise-a-chat prompt", v -> { copy(SUM); log("Copied."); });
              logv = new TextView(this); box.addView(logv);
              if (!sp.getString("t", "").isEmpty()) loadRepos();
            }

            void head(String t, String d) {
              TextView a = new TextView(this); a.setText(t); a.setTextSize(18); a.setTypeface(null, Typeface.BOLD);
              a.setTextColor(Color.parseColor("#1D4ED8")); a.setPadding(0, 36, 0, 4); box.addView(a);
              TextView b = new TextView(this); b.setText(d); b.setTextSize(13); b.setTextColor(Color.parseColor("#6B7280")); box.addView(b);
            }
            Button btn(String t, View.OnClickListener l) {
              Button b = new Button(this); b.setText(t); b.setAllCaps(false); b.setOnClickListener(l); box.addView(b); return b;
            }
            EditText edit(String hint, boolean multi) {
              EditText e = new EditText(this); e.setHint(hint);
              if (multi) { e.setMinLines(3); e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE); }
              box.addView(e); return e;
            }
            void fill(Spinner s, List<String> l) { s.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, l)); }
            void log(String s) { runOnUiThread(() -> logv.setText(s)); }
            void feed(String s) { runOnUiThread(() -> feedv.setText(s)); }
            void copy(String s) { runOnUiThread(() -> ((ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("t", s))); }
            String cut(String s) { return s.length() > 200 ? s.substring(0, 200) : s; }
            String cur() { Object o = projs.getSelectedItem(); return o == null ? "" : o.toString(); }
            String hub() { return hubBox.getText().toString().trim(); }
            List<String> plist() { String s = sp.getString("p", ""); return s.isEmpty() ? new ArrayList<>() : new ArrayList<>(Arrays.asList(s.split(","))); }
            void refreshP() { fill(projs, plist()); }

            byte[] readAll(InputStream in) throws Exception {
              ByteArrayOutputStream b = new ByteArrayOutputStream(); byte[] x = new byte[4096]; int n;
              while ((n = in.read(x)) > 0) b.write(x, 0, n);
              return b.toByteArray();
            }

            R api(String method, String path, String body) {
              R r = new R();
              try {
                HttpURLConnection c = (HttpURLConnection) new URL("https://api.github.com" + path).openConnection();
                c.setRequestMethod(method);
                c.setRequestProperty("Authorization", "Bearer " + sp.getString("t", ""));
                c.setRequestProperty("Accept", "application/vnd.github+json");
                c.setConnectTimeout(15000); c.setReadTimeout(30000);
                if (body != null) {
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  try (OutputStream o = c.getOutputStream()) { o.write(body.getBytes(StandardCharsets.UTF_8)); }
                }
                r.code = c.getResponseCode();
                InputStream in = r.code < 400 ? c.getInputStream() : c.getErrorStream();
                r.body = in == null ? "" : new String(readAll(in), StandardCharsets.UTF_8);
              } catch (Exception e) { r.code = -1; r.body = e.toString(); }
              return r;
            }

            String rf(String repo, String p) throws Exception {
              R r = api("GET", "/repos/" + repo + "/contents/" + p, null);
              if (r.code != 200) return "";
              return new String(Base64.decode(new JSONObject(r.body).getString("content"), Base64.DEFAULT), StandardCharsets.UTF_8);
            }

            String put(String repo, String path, String txt, boolean force) throws Exception {
              String u = "/repos/" + repo + "/contents/" + path, sha = null;
              R g = api("GET", u, null);
              if (g.code == 200) {
                if (!force) return path + ": already there";
                sha = new JSONObject(g.body).getString("sha");
              }
              JSONObject b = new JSONObject().put("message", "AI assistant: add " + path)
                  .put("content", Base64.encodeToString(txt.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP));
              if (sha != null) b.put("sha", sha);
              R p = api("PUT", u, b.toString());
              if (p.code >= 300) throw new Exception(p.code + " " + cut(p.body));
              return path + (sha == null ? ": added" : ": updated");
            }

            String asset(String n) throws Exception { return new String(readAll(getAssets().open(n)), StandardCharsets.UTF_8); }

            String dispatch(String hub, String repo, String task) {
              try {
                JSONObject in = new JSONObject().put("repo", repo).put("task", task).put("step", "1");
                R r = api("POST", "/repos/" + hub + "/actions/workflows/agent.yml/dispatches", new JSONObject().put("ref", "main").put("inputs", in).toString());
                return r.code == 204 ? "" : "Could not start the agent (" + r.code + "). " + cut(r.body) + "\nCheck that the hub has its two secrets and its files.";
              } catch (Exception e) { return e.toString(); }
            }

            void loadRepos() {
              sp.edit().putString("t", tok.getText().toString().trim()).apply();
              ex.execute(() -> {
                R r = api("GET", "/user/repos?per_page=100&sort=updated", null);
                if (r.code != 200) { log("Could not load repositories (" + r.code + "). " + cut(r.body)); return; }
                try {
                  JSONArray a = new JSONArray(r.body); List<String> l = new ArrayList<>();
                  for (int i = 0; i < a.length(); i++) l.add(a.getJSONObject(i).getString("full_name"));
                  R u = api("GET", "/user", null);
                  if (u.code == 200) {
                    final String login = new JSONObject(u.body).getString("login");
                    sp.edit().putString("login", login).apply();
                    if (hub().isEmpty()) runOnUiThread(() -> hubBox.setText(login + "/ai-hub"));
                  }
                  runOnUiThread(() -> fill(repos, l));
                  log("Repositories loaded: " + l.size());
                } catch (Exception e) { log(e.toString()); }
              });
            }

            void addP() {
              Object o = repos.getSelectedItem(); if (o == null) return;
              List<String> l = plist();
              if (!l.contains(o.toString())) l.add(o.toString());
              sp.edit().putString("p", String.join(",", l)).apply();
              refreshP();
            }

            void mkHub() {
              final String login = sp.getString("login", "");
              if (login.isEmpty()) { log("Tap Save token and load repositories first."); return; }
              final String name = login + "/ai-hub";
              ex.execute(() -> {
                try {
                  R r = api("POST", "/user/repos", new JSONObject().put("name", "ai-hub").put("private", true).put("auto_init", true).put("description", "AI build hub").toString());
                  if (r.code >= 300 && r.code != 422) { log("Could not create the hub (" + r.code + "). " + cut(r.body)); return; }
                  Thread.sleep(2000);
                  put(name, "agent.mjs", asset("hub-agent.mjs"), true);
                  put(name, ".github/workflows/agent.yml", asset("hub-agent.yml"), true);
                  sp.edit().putString("hub", name).apply();
                  runOnUiThread(() -> hubBox.setText(name));
                  log("Hub ready: " + name + "\nLast step, in that repo on GitHub: Settings > Secrets and variables > Actions > New repository secret. Add ANTHROPIC_API_KEY (your Claude API key) and GH_PAT (the same GitHub token you pasted here).");
                } catch (Exception e) { log("Hub setup failed. " + e.getMessage() + "\nThe token needs Contents and Workflows write access, and permission to create repos."); }
              });
            }

            void create() {
              final String hub = hub();
              final String n = nameBox.getText().toString().trim().toLowerCase().replaceAll("[^a-z0-9._-]+", "-");
              final String pr = promptBox.getText().toString().trim();
              if (hub.isEmpty() || n.isEmpty() || pr.isEmpty()) { log("Create the hub first, then enter a project name and a prompt."); return; }
              if (SEC.matcher(pr).find()) { log("Blocked: the prompt looks like it contains a key or token. Remove it first."); return; }
              ex.execute(() -> {
                try {
                  R r = api("POST", "/user/repos", new JSONObject().put("name", n).put("private", true).put("auto_init", true).toString());
                  if (r.code >= 300) { log("Could not create the repo (" + r.code + "). " + cut(r.body) + "\nA fine-grained token cannot always create repos. If so, use a classic token with the repo and workflow scopes."); return; }
                  final String repo = new JSONObject(r.body).getString("full_name");
                  Thread.sleep(2000);
                  for (String[] k : MEM) put(repo, ".ai/" + k[0] + ".md", k[0].equals("PROJECT") ? "# Project\n" + pr + "\n" : k[1], false);
                  List<String> l = plist(); l.add(repo);
                  sp.edit().putString("p", String.join(",", l)).apply();
                  runOnUiThread(() -> { refreshP(); projs.setSelection(l.size() - 1); });
                  String err = dispatch(hub, repo, "");
                  log(err.isEmpty() ? "Created " + repo + " and started the agent. Tap Refresh progress in a minute." : "Created " + repo + " but: " + err);
                } catch (Exception e) { log("Failed. " + e.getMessage()); }
              });
            }

            void go(String task) {
              final String hub = hub(), repo = cur();
              if (hub.isEmpty() || repo.isEmpty()) { log("Select a project and set the hub first."); return; }
              ex.execute(() -> {
                String err = dispatch(hub, repo, task.trim());
                log(err.isEmpty() ? "Agent started for " + repo + ". Tap Refresh progress." : err);
              });
            }

            void progress() {
              final String repo = cur(); if (repo.isEmpty()) return;
              ex.execute(() -> {
                try {
                  JSONArray a = new JSONArray(api("GET", "/repos/" + repo + "/issues?labels=agent-log&state=all&per_page=1", null).body);
                  if (a.length() == 0) { feed("No progress yet. The agent posts here once it starts."); return; }
                  int n = a.getJSONObject(0).getInt("number");
                  JSONArray c = new JSONArray(api("GET", "/repos/" + repo + "/issues/" + n + "/comments?per_page=100", null).body);
                  StringBuilder s = new StringBuilder();
                  for (int i = Math.max(0, c.length() - 12); i < c.length(); i++) s.append("- ").append(c.getJSONObject(i).getString("body")).append("\n\n");
                  feed(s.length() == 0 ? "Waiting for the first update..." : s.toString());
                } catch (Exception e) { feed("Could not read progress. " + e.getMessage()); }
              });
            }

            void cancel() {
              final String hub = hub(); if (hub.isEmpty()) return;
              ex.execute(() -> {
                try {
                  JSONArray a = new JSONObject(api("GET", "/repos/" + hub + "/actions/runs?per_page=5", null).body).getJSONArray("workflow_runs");
                  for (int i = 0; i < a.length(); i++) {
                    JSONObject j = a.getJSONObject(i);
                    if (!j.getString("status").equals("completed")) {
                      R r = api("POST", "/repos/" + hub + "/actions/runs/" + j.getLong("id") + "/cancel", "{}");
                      log(r.code < 300 ? "Stopped the running agent." : "Could not stop it (" + r.code + ")."); return;
                    }
                  }
                  log("No agent is running.");
                } catch (Exception e) { log(e.toString()); }
              });
            }

            void save() {
              final String repo = cur(), t = impBox.getText().toString().trim();
              if (repo.isEmpty() || t.isEmpty()) return;
              if (SEC.matcher(t).find()) { log("Blocked: the text looks like it contains a key or token. Remove it first."); return; }
              ex.execute(() -> {
                try {
                  String n = ".ai/imports/" + new SimpleDateFormat("yyyy-MM-dd-HHmmss", Locale.US).format(new Date()) + ".md";
                  log(put(repo, n, t, false));
                  runOnUiThread(() -> impBox.setText(""));
                } catch (Exception e) { log(e.getMessage()); }
              });
            }

            void ctx() {
              final String repo = cur(); if (repo.isEmpty()) return;
              ex.execute(() -> {
                try {
                  StringBuilder s = new StringBuilder("PROJECT CONTEXT for " + repo + ". Read all of this, then continue the next unfinished task in TASKS. Do not repeat finished work. If anything conflicts or is unclear, ask me before acting.\n");
                  for (String k : new String[]{"PROJECT", "DECISIONS", "TASKS", "AGENTS"}) s.append("\n## ").append(k).append("\n").append(rf(repo, ".ai/" + k + ".md"));
                  String pr = rf(repo, ".ai/PROGRESS.md");
                  s.append("\n## LATEST PROGRESS\n").append(pr.length() > 3000 ? pr.substring(pr.length() - 3000) : pr);
                  R d = api("GET", "/repos/" + repo + "/contents/.ai/imports", null);
                  if (d.code == 200) {
                    JSONArray a = new JSONArray(d.body);
                    for (int i = Math.max(0, a.length() - 5); i < a.length(); i++) {
                      String n = a.getJSONObject(i).getString("name");
                      s.append("\n## CHAT SUMMARY ").append(n).append("\n").append(rf(repo, ".ai/imports/" + n));
                    }
                  }
                  copy(s.toString());
                  log("Copied " + s.length() + " characters. Paste it as the first message in the new chat.");
                } catch (Exception e) { log(e.toString()); }
              });
            }
          }
          EOF
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
